<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaceMark – Face Recognition Attendance</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<style>
  :root{
    --bg:#f3f5f2; --surface:#ffffff; --ink:#16211c; --muted:#5d6b64;
    --line:#d9dfdb; --accent:#0f6b4f; --accent-ink:#ffffff; --warn:#b3261e; --ok:#0f6b4f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1512; --surface:#18211c; --ink:#e8efea; --muted:#93a39a; --line:#2a362f; --accent:#4fc79a; --accent-ink:#06261b; --warn:#ff8a80; --ok:#4fc79a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  h1{margin:0;font-size:1.35rem;letter-spacing:-.01em}
  #status{font-size:.9rem;color:var(--muted)}
  main{max-width:1100px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}
  @media(max-width:820px){main{grid-template-columns:1fr;padding:16px}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
  .stage{position:relative;aspect-ratio:4/3;background:#000;border-radius:8px;overflow:hidden}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:not-allowed}
  input[type=text]{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
  .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .row input{flex:1;min-width:160px}
  h2{font-size:1.05rem;margin:0 0 10px}
  .msg{min-height:1.4em;margin-top:10px;font-size:.92rem}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--warn)}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600}
  .empty{color:var(--muted);font-size:.92rem;padding:8px 0}
  .people{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;font-size:.88rem;display:flex;align-items:center;gap:6px}
  .chip button{border:none;background:none;padding:0 6px;color:var(--muted);font-size:1rem;line-height:1}
  .hidden{display:none}
  .side{display:flex;flex-direction:column;gap:24px}
</style>
</head>
<body>
<header>
  <h1>FaceMark attendance</h1>
  <div id="status" role="status">Loading face models…</div>
</header>

<main>
  <section class="panel">
    <div class="tabs" role="tablist">
      <button id="tabAttend" class="on" role="tab">Mark attendance</button>
      <button id="tabRegister" role="tab">Register a person</button>
    </div>
    <div class="stage">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>
    <div class="row">
      <button id="camBtn" class="primary">Start camera</button>
    </div>

    <div id="registerBox" class="hidden">
      <div class="row">
        <input id="nameInput" type="text" placeholder="Full name" aria-label="Full name" autocomplete="off">
        <button id="captureBtn" class="primary" disabled>Capture face</button>
      </div>
      <p style="color:var(--muted);font-size:.88rem;margin:8px 0 0">Look straight at the camera in good light. One face only. Capture 2–3 times for better accuracy.</p>
    </div>
    <div id="msg" class="msg" aria-live="polite"></div>
  </section>

  <div class="side">
    <section class="panel">
      <h2>Today's attendance</h2>
      <div class="scroll"><table id="todayTable"><thead><tr><th>Name</th><th>Time</th></tr></thead><tbody></tbody></table></div>
      <div id="todayEmpty" class="empty">Nobody marked present yet.</div>
      <div class="row">
        <button id="csvBtn">Download CSV (all days)</button>
        <button id="clearLogBtn">Clear attendance log</button>
      </div>
    </section>

    <section class="panel">
      <h2>Registered people</h2>
      <div id="people" class="people"></div>
      <div id="peopleEmpty" class="empty">No one registered yet. Use “Register a person”.</div>
    </section>
  </div>
</main>

<script>
(() => {
  const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
  const $ = id => document.getElementById(id);
  const video = $('video'), overlay = $('overlay');
  const KEY_PEOPLE = 'facemark_people_v1', KEY_LOG = 'facemark_log_v1';
  let mode = 'attend', modelsReady = false, camOn = false, loopTimer = null, matcher = null;
  const detOpts = () => new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });

  // ---------- storage ----------
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { setMsg('Storage is full or blocked in this browser.', 'err'); } };
  let people = load(KEY_PEOPLE, []);   // [{name, descriptors:[[128 floats],...]}]
  let log = load(KEY_LOG, []);         // [{name, date, time}]

  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const timeStr = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  function setMsg(t, cls) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); }
  function setStatus(t) { $('status').textContent = t; }

  // ---------- UI renders ----------
  function renderPeople() {
    const box = $('people'); box.innerHTML = '';
    $('peopleEmpty').classList.toggle('hidden', people.length > 0);
    people.forEach((p, i) => {
      const c = document.createElement('div'); c.className = 'chip';
      const s = document.createElement('span'); s.textContent = p.name + ' (' + p.descriptors.length + ')';
      const b = document.createElement('button'); b.textContent = '×'; b.setAttribute('aria-label', 'Remove ' + p.name);
      b.onclick = () => { if (confirm('Remove ' + p.name + '?')) { people.splice(i, 1); save(KEY_PEOPLE, people); buildMatcher(); renderPeople(); } };
      c.append(s, b); box.append(c);
    });
  }
  function renderToday() {
    const tb = $('todayTable').querySelector('tbody'); tb.innerHTML = '';
    const rows = log.filter(r => r.date === todayStr());
    $('todayEmpty').classList.toggle('hidden', rows.length > 0);
    rows.forEach(r => {
      const tr = document.createElement('tr');
      const a = document.createElement('td'); a.textContent = r.name;
      const b = document.createElement('td'); b.textContent = r.time;
      tr.append(a, b); tb.append(tr);
    });
  }

  // ---------- face matching ----------
  function buildMatcher() {
    const labeled = people.filter(p => p.descriptors.length)
      .map(p => new faceapi.LabeledFaceDescriptors(p.name, p.descriptors.map(d => new Float32Array(d))));
    matcher = labeled.length ? new faceapi.FaceMatcher(labeled, 0.5) : null;
  }

  function markPresent(name) {
    if (log.some(r => r.name === name && r.date === todayStr())) return false;
    log.push({ name, date: todayStr(), time: timeStr() });
    save(KEY_LOG, log); renderToday();
    return true;
  }

  // ---------- camera ----------
  async function startCam() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      video.srcObject = stream; await video.play();
      camOn = true; $('camBtn').textContent = 'Stop camera';
      overlay.width = video.videoWidth; overlay.height = video.videoHeight;
      $('captureBtn').disabled = !modelsReady;
      setMsg(mode === 'attend' ? 'Camera on. Stand in front of it to be marked present.' : 'Camera on. Enter a name and capture.', '');
      loop();
    } catch (e) {
      setMsg('Could not open the camera. Allow camera permission and use HTTPS (GitHub Pages is fine).', 'err');
    }
  }
  function stopCam() {
    camOn = false; clearTimeout(loopTimer);
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null; overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
    $('camBtn').textContent = 'Start camera'; $('captureBtn').disabled = true;
  }

  async function loop() {
    if (!camOn) return;
    if (modelsReady && video.readyState >= 2) {
      const dets = await faceapi.detectAllFaces(video, detOpts()).withFaceLandmarks().withFaceDescriptors();
      const ctx = overlay.getContext('2d'); ctx.clearRect(0, 0, overlay.width, overlay.height);
      ctx.lineWidth = 3; ctx.font = '600 18px sans-serif';
      dets.forEach(d => {
        let label = 'Face', color = '#f2c94c';
        if (mode === 'attend') {
          if (!matcher) { label = 'No one registered'; }
          else {
            const best = matcher.findBestMatch(d.descriptor);
            if (best.label !== 'unknown') {
              color = '#4fc79a';
              const fresh = markPresent(best.label);
              label = best.label + (fresh ? ' ✓ marked' : ' (already marked)');
              if (fresh) setMsg(best.label + ' marked present at ' + timeStr() + '.', 'ok');
            } else { label = 'Unknown'; color = '#ff8a80'; }
          }
        }
        const b = d.detection.box;
        ctx.strokeStyle = color; ctx.strokeRect(b.x, b.y, b.width, b.height);
        const w = ctx.measureText(label).width + 12;
        ctx.fillStyle = color; ctx.fillRect(b.x, Math.max(0, b.y - 26), w, 26);
        ctx.fillStyle = '#000'; ctx.fillText(label, b.x + 6, Math.max(18, b.y - 7));
      });
    }
    loopTimer = setTimeout(loop, 250);
  }

  // ---------- register ----------
  async function capture() {
    const name = $('nameInput').value.trim();
    if (!name) return setMsg('Enter a name first.', 'err');
    const dets = await faceapi.detectAllFaces(video, detOpts()).withFaceLandmarks().withFaceDescriptors();
    if (dets.length === 0) return setMsg('No face found. Move closer and face the camera.', 'err');
    if (dets.length > 1) return setMsg('More than one face in view. Only one person at a time.', 'err');
    const desc = Array.from(dets[0].descriptor);
    let p = people.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!p) { p = { name, descriptors: [] }; people.push(p); }
    p.descriptors.push(desc);
    save(KEY_PEOPLE, people); buildMatcher(); renderPeople();
    setMsg('Captured face ' + p.descriptors.length + ' for ' + p.name + '. Capture again from a slightly different angle for better accuracy.', 'ok');
  }

  // ---------- CSV ----------
  function downloadCSV() {
    if (!log.length) return setMsg('Nothing to export yet.', 'err');
    const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
    const csv = ['Name,Date,Time'].concat(log.map(r => [esc(r.name), r.date, esc(r.time)].join(','))).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'attendance-' + todayStr() + '.csv'; a.click(); URL.revokeObjectURL(a.href);
  }

  // ---------- events ----------
  function setMode(m) {
    mode = m;
    $('tabAttend').classList.toggle('on', m === 'attend');
    $('tabRegister').classList.toggle('on', m === 'register');
    $('registerBox').classList.toggle('hidden', m !== 'register');
    setMsg('', '');
  }
  $('tabAttend').onclick = () => setMode('attend');
  $('tabRegister').onclick = () => setMode('register');
  $('camBtn').onclick = () => camOn ? stopCam() : startCam();
  $('captureBtn').onclick = capture;
  $('csvBtn').onclick = downloadCSV;
  $('clearLogBtn').onclick = () => { if (confirm('Delete all attendance records?')) { log = []; save(KEY_LOG, log); renderToday(); } };

  // ---------- init ----------
  (async () => {
    renderPeople(); renderToday();
    try {
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);
      modelsReady = true; buildMatcher();
      setStatus('Ready');
      if (camOn) $('captureBtn').disabled = false;
    } catch (e) {
      setStatus('Failed to load models. Check your internet connection.');
    }
  })();
})();
</script>
</body>
</html>
